#   ]
#   batch_size: 64

architecture:
  encoders:
    S1:
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5
      layer_size: 128
      n_layers: 2
      seq_len: 12
      use_norm: True
    S2_S2VI:
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5
      layer_size: 128
      n_layers: 2
      seq_len: 12
      use_norm: True
    weather:
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5
      layer_size: 128
      n_layers: 2
      seq_len: 12
      use_norm: True
    DEM:
      model_type: mlp
      n_layers: 1
      layer_size: 128
      dropout: 0.2
      batchnorm: False
      use_norm: True
    geo:
      model_type: mlp
      n_layers: 1
      layer_size: 128
      dropout: 0.2
      batchnorm: False
      use_norm: False
  predictive_model:
    n_layers: 1
    layer_size: 128
    dropout: 0.2
    batchnorm: True

method:
  feature: True
  agg_args:
    mode: avg_ignore
    adaptive: False