output_dir_folder: ./res_out_multi
input_dir_folder: /home/casado/DsensDp/data/out/
additional_method_name: FCoM-avg-geo-mmulti

load_memory: True
data_name: cropharvest_multi
task_type: classification

save_weights: True 
save_test_set: True
weights_dir: ./res_out_multi/weights
testset_dir: ./res_out_multi/test_sets

training:
  #max_epochs: 2  # valeur de test originale
  max_epochs: 100
  batch_size: 128
  emb_dim: 128
  early_stop_args:
    min_delta: 0.01
    mode: min
    patience: 5
    verbose: True
  missing_as_aug: True
  missing_method:
    name: ignore
  additional_args:
    optimizer: adam
    lr: 0.001

experiment:
  #runs_seed: [30]  # seed original CoM-views
  runs_seed: [10]
  #kfolds: 10       # original CoM-views
  kfolds: 5
  preprocess:
    fillnan: False
    flatten: False
    form: zscore
    view_names: ["S2_S2VI","S1","weather","DEM", "geo"]

# args_forward: (à utiliser séparément avec evaluate_rob_pred.py)
