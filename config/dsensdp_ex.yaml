output_dir_folder: ./res_out
input_dir_folder: /home/casado/DsensDp/data/out/
additional_method_name: -Plus

load_memory: True
compute_shapley: True
data_name: cropharvest_binary
task_type: classification

save_weights: True 
save_test_set : True
weights_dir: ./res_out/weights
testset_dir: ./res_out/test_sets


training:
  max_epochs: 100 # was 2 changed to100 like in the paper
  batch_size: 128 # was 256 changed to 128 like in the paper
  emb_dim: 128
  early_stop_args:
    min_delta: 0.01
    mode: min
    patience: 5
    verbose: True
  parallel_processes: 1

  missing_as_aug: True
  missing_method:
    random_perc: 0.5
    name: ignore 

  additional_args:
    optimizer: adam 
    lr: 0.001

    weights_loss_variations:
      main: 1
      full : 1
      individual_sd: 1
      individual: 1

      cross_temp: 0.5

experiment: 
  runs_seed: [10] #repetitions
  kfolds: 5
  preprocess: 
    fillnan: False
    flatten: False
    form: zscore  
    view_names: ["S2_S2VI","S1" ,"weather","DEM"]

# args_forward: #only for testing
